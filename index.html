lRect(510-i,365-i*.5,i*2,i)}}

rk()">+</button></div>';$('sidebar').innerHTML='<div class="eyebrow">THE NEXT THREE QUESTIONS</div><h2>Potential research gaps</h2><p style="font-size:11px">'+gs.length+' meet your threshold · '+scope.toLowerCase()+'</p><label style="font:10px monospace;color:var(--muted)">Minimum suitability: '+threshold+'/100<input aria-label="Minimum suitability" type="range" min="50" max="100" value="'+threshold+'" style="width:100%;accent-color:var(--gold);margin-top:12px" onchange="threshold=Number(this.value);render()"></label>'+gs.slice(0,3).map((x,i)=>'<article class="gap '+(x.id===selectedId?'selected':'')+'"><div class="gapmeta">0'+(i+1)+' / '+x.score+'/100 SUITABILITY · DEMO</div><h3>'+esc(x.a)+' × '+esc(x.b)+'</h3><p>'+esc(x.reason)+'</p><div class="gapactions"><button class="secondary" onclick="selectedId=\''+x.id+'\';renderNetwork()">Highlight</button><button class="secondary" onclick="detail(\''+x.id+'\')">Evidence ↗</button><button class="secondary" aria-label="'+(saved.has(x.id)?'Remove from shortlist':'Save to shortlist')+'" onclick="saveGap(\''+x.id+'\')">'+(saved.has(x.id)?'★':'☆')+'</button><button class="primary" onclick="draft(\''+x.id+'\')">Generate abstract →</button></div></article>').join('')+(!gs.length?'<div class="empty"><b>No suggestions meet the suitability threshold.</b><p>Lower the threshold or broaden your scope.</p></div>':'')+'<p class="note">A missing link is not proof of novelty. Inspect the literature before developing a proposal.</p><button class="textbtn" onclick="filterField=field;route(\'gaps\')">Browse all opportunities →</button>'}

draft=function(id){delete $('modalbody').dataset.gap;let g=find(id);openModal('<div class="eyebrow">RESEARCH WORKSPACE / PROPOSED STUDY</div><h2 class="detailtitle">'+esc(g.a)+' × '+esc(g.b)+'</h2><div class="generator-tabs"><button id="liveMode" class="secondary" aria-pressed="'+(abstractMode==='live')+'" onclick="setAbstractMode(\'live\')">Live AI</button><button id="offlineMode" class="secondary" aria-pressed="'+(abstractMode==='offline')+'" onclick="setAbstractMode(\'offline\')">Offline draft</button></div><div class="abstractsettings"><label>FORMAT<select id="abstractStyle"><option>Structured</option><option>Narrative</option></select></label><label>TARGET LENGTH<select id="abstractLength"><option value="250">About 250 words</option><option value="150">About 150 words</option></select></label><label class="full">YOUR RESEARCH AIM (OPTIONAL)<input id="abstractGoal" maxlength="1200" placeholder="Refine the question or describe your intended study"></label><label class="full">SUPPORTING LITERATURE (OPTIONAL)<textarea id="abstractEvidence" style="min-height:75px" maxlength="16000" placeholder="Add paper titles, abstracts, and verified references. These will be sent to the model in Live AI mode."></textarea></label></div><div class="generation-status" id="abstractStatus" role="status">'+(abstractMode==='live'?'Checking the live generation service…':'Offline composition uses this gap’s study plan and your aim; it is not a live AI response.')+'</div><button id="generateAbstract" class="primary" onclick="generateAbstract(\''+id+'\')">Generate abstract →</button><div id="abstractOutputArea" style="margin-top:22px;display:none"><div class="detailheading" id="abstractProvenance"></div><textarea id="abstractOutput" class="abstract-output" aria-label="Generated proposed abstract"></textarea><div class="modalactions"><button class="secondary" onclick="downloadText($(\'abstractOutput\').value,\'frontier-proposed-abstract.txt\',\'text/plain\')">Download abstract</button><button class="primary" onclick="copyAbstract(this)">Copy abstract</button></div></div><p class="note">Proposed study only. No invented findings or references. The selected gap and model evidence are demo data; generated text needs researcher review.</p>');checkAbstractService()};
function setAbstractMode(mode){if(abstractBusy)return;abstractMode=mode;$('liveMode').setAttribute('aria-pressed',String(mode==='live'));$('offlineMode').setAttribute('aria-pressed',String(mode==='offline'));checkAbstractService()}
async function checkAbstractService(){if(!$('abstractStatus'))return;let status=$('abstractStatus');status.classList.remove('error');if(abstractMode==='offline'){status.textContent='Offline composition: produces a complete proposed abstract using the selected study plan. Not a live AI response.';return}if(location.protocol==='file:'){status.classList.add('error');status.textContent='Live AI requires the FRONTIER server. Open its localhost address after server-side model access is configured. No API key belongs in this browser.';return}try{let r=await fetch('/api/health',{signal:AbortSignal.timeout(5000)}),v=await r.json();status.textContent=v.configured?'Live AI is ready. Only the selected gap, aim, format, and supplied literature will be sent.':'Live AI is not configured yet. Server-side model access is required; offline drafting is available.';status.classList.toggle('error',!v.configured)}catch{status.classList.add('error');status.textContent='Live generation service is unavailable. Start the FRONTIER backend, or select Offline draft.'}}
async function generateAbstract(id){if(abstractBusy)return;let g=find(id),goal=$('abstractGoal').value,style=$('abstractStyle').value,length=$('abstractLength').value,evidence=$('abstractEvidence').value,status=$('abstractStatus'),btn=$('generateAbstract');if(abstractMode==='offline'){showAbstract(proposedAbstract(g,goal,style,length),'OFFLINE GENERATED DRAFT · NOT A LIVE AI RESPONSE');status.classList.remove('error');status.textContent=evidence?'Draft generated. Supplied literature has not been analysed in offline mode; review and incorporate it yourself.':'Complete proposed abstract generated. Edit the draft below.';return}if(location.protocol==='file:'){checkAbstractService();return}abstractBusy=true;btn.disabled=true;btn.textContent='Generating…';status.classList.remove('error');status.textContent='Generating a proposed abstract from the selected gap and supplied context…';abstractController=new AbortController();let timeout=setTimeout(()=>abstractController.abort(),90000);try{let r=await fetch('/api/abstract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,goal,style,length:Number(length),evidence}),signal:abstractController.signal});let v=await r.json();if(!r.ok)throw Error(v.error||'Generation failed.');if(!$('abstractOutput'))return;showAbstract(v.abstract,'LIVE AI DRAFT · '+v.model);status.textContent='Generated successfully. Review the proposed methods and references before using this draft.'}catch(e){if(status.isConnected){status.classList.add('error');status.textContent=e.name==='AbortError'?'Generation timed out or was cancelled. You can retry.':e.message}}finally{clearTimeout(timeout);abstractBusy=false;if(btn.isConnected){btn.disabled=false;btn.textContent='Generate abstract →'}}}
function showAbstract(text,source){$('abstractOutputArea').style.display='block';$('abstractOutput').value=text;$('abstractProvenance').textContent=source}
async function copyAbstract(btn){try{await navigator.clipboard.writeText($('abstractOutput').value);btn.textContent='Copied ✓'}catch{$('abstractOutput').select();btn.textContent='Selected — copy with keyboard'}}
$('modal').addEventListener('close',()=>{if(abstractBusy)abstractController?.abort()});
</script></body></html>
